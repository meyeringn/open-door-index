name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check data, sources, dates, and copy
        run: node tests/validate.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright and axe-core
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
          npm install --no-save --no-package-lock axe-core@4
      - name: Browser smoke test and axe scan (1280px, 390px, 320px)
        run: SCREENSHOTS=shots python tests/smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots/

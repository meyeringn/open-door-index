name: Check links and archive sources

# Weekly, and on demand from the Actions tab. A broken source fails the run and GitHub emails the owner.
on:
  schedule:
    - cron: "17 11 * * 1" # Mondays, 6:17 a.m. Eastern
  workflow_dispatch:
  pull_request:
    paths: ["data/bodies.js", "index.html"]

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check every source and outside link
        run: node scripts/check-links.mjs ${{ github.event_name != 'pull_request' && '--archive' || '' }}
